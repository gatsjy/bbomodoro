<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bbomodoro</title>
  <style>
    /* Galmuri9 (c) Lee Minseo, SIL Open Font License 1.1 — see fonts/Galmuri-OFL.md */
    @font-face {
      font-family: Galmuri9;
      src: url(fonts/Galmuri9.woff2) format('woff2');
      font-display: block;
    }
    html, body { margin: 0; height: 100%; background: #fdf0d5; overflow: hidden; }
    /* one pixel font everywhere; sizes are multiples of its native 10px times --s
       (CSS px per art pixel) so its pixels match the canvas art pixels */
    body {
      user-select: none; -webkit-user-select: none;
      font-family: Galmuri9, monospace;
      -webkit-font-smoothing: none; font-smooth: never;
      color: #3b1424;
    }
    body.focus { background: #f8e2bd; }
    #stage { position: absolute; font-size: calc(var(--s) * 10px); line-height: calc(var(--s) * 12px); }
    #screen { display: block; cursor: pointer; image-rendering: pixelated; }

    /* goal input sits inside the pixel box drawn at (8,17) 128x14 on the canvas */
    #taskInput {
      position: absolute; box-sizing: border-box;
      left: calc(var(--s) * 20px); top: calc(var(--s) * 18px);
      width: calc(var(--s) * 115px); height: calc(var(--s) * 12px);
      font: inherit; line-height: calc(var(--s) * 12px);
      border: 0; outline: 0; padding: 0; margin: 0;
      background: #fff8ea; color: #3b1424; user-select: text; -webkit-user-select: text;
    }
    #taskInput::placeholder { color: #b58b7a; }

    /* record panel */
    #record {
      position: absolute; inset: 0; background: rgba(59, 20, 36, .35);
      display: flex; align-items: center; justify-content: center;
    }
    #record[hidden] { display: none; }
    .panel {
      width: calc(var(--s) * 128px); height: calc(var(--s) * 204px);
      background: #fff8ea; padding: calc(var(--s) * 6px); box-sizing: border-box;
      display: flex; flex-direction: column; gap: calc(var(--s) * 4px);
      box-shadow:
        0 0 0 calc(var(--s) * 1px) #3b1424,
        calc(var(--s) * 2px) calc(var(--s) * 2px) 0 calc(var(--s) * 1px) #3b1424;
    }
    .panel h2 { margin: 0; font: inherit; text-align: center; }
    .stats { display: flex; text-align: center; }
    .stats div { flex: 1; color: #b58b7a; }
    .stats b { display: block; white-space: nowrap; font-weight: 400; font-size: calc(var(--s) * 20px); line-height: calc(var(--s) * 22px); color: #e8434f; }
    .stats b small { font-size: calc(var(--s) * 10px); color: #3b1424; }
    #rGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: calc(var(--s) * 1px); }
    #rGrid i { font-style: normal; text-align: center; color: #b58b7a; }
    #rGrid span {
      height: calc(var(--s) * 12px); display: flex; align-items: center; justify-content: center;
      color: #b58b7a; background: #eadbc6;
    }
    #rGrid span.lv1 { background: #ffb3a8; color: #3b1424; }
    #rGrid span.lv2 { background: #e8434f; color: #fff8ea; }
    #rGrid span.lv3 { background: #a3203a; color: #fff8ea; }
    #rGrid span.today { box-shadow: inset 0 0 0 calc(var(--s) * 1px) #3b1424; }
    .sub { border-top: calc(var(--s) * 1px) dashed #b58b7a; padding-top: calc(var(--s) * 3px); }
    #rLog { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; flex: 1; }
    #rLog li { word-break: break-all; }
    #rLog li b { font-weight: 400; color: #e8434f; }
    #rLog li.none { color: #b58b7a; }
    #rClose {
      font: inherit; cursor: pointer; border: 0; color: #fff8ea; background: #e8434f;
      padding: calc(var(--s) * 1px); box-shadow: 0 0 0 calc(var(--s) * 1px) #3b1424;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="screen"></canvas>
    <input id="taskInput" maxlength="40" placeholder="예) 영어 단어 100개 외우기" hidden>
    <div id="record" hidden>
      <div class="panel">
        <h2>기록</h2>
        <div class="stats">
          <div>연속<b><span id="rStreak">0</span><small>일</small></b></div>
          <div>최고<b><span id="rBest">0</span><small>일</small></b></div>
          <div>총 집중<b><span id="rTotal">0</span><small>시간</small></b></div>
        </div>
        <div id="rGrid"></div>
        <div class="sub">달성한 목표</div>
        <ul id="rLog"></ul>
        <button id="rClose">닫기</button>
      </div>
    </div>
  </div>
  <script src="js/neutralino.js"></script>
  <script src="js/sprite.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
